<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRADING BY RAHAT - QUOTEX OTC PRO</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding-bottom: 70px; }
    header { position: sticky; top: 0; z-index: 99; background: #1e293b; padding: 12px; border-bottom: 2px solid #22c55e; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; color: #22c55e; font-size: 20px; }
    .tabs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: #1e293b; }
    .tabs button { white-space: nowrap; border: 1.5px solid #22c55e; background: #0f172a; color: #22c55e; padding: 8px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; }
    .tabs button.active { background: #22c55e; color: #fff; }
    .card { background: #1e293b; margin: 10px; border-radius: 14px; padding: 14px; border: 1px solid #334155; }
    select, input { width: 100%; padding: 11px; border: 1.5px solid #334155; background: #0f172a; color: #fff; border-radius: 10px; margin: 6px 0; }
    .btn { width: 100%; background: #22c55e; color: #fff; border: 0; padding: 13px; border-radius: 11px; font-weight: 900; cursor: pointer; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; background: #0f172a; border-radius: 10px; padding: 10px; text-align: center; }
    .bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; display: flex; border-top: 2px solid #22c55e; z-index: 99; }
    .bottom button { flex: 1; padding: 12px 2px; border: 0; background: #1e293b; color: #94a3b8; font-weight: 700; font-size: 12px; cursor: pointer; }
    .bottom button.active { color: #22c55e; border-top: 3px solid #22c55e; }
    .small { font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .alertBox { background: #334155; border: 1px solid #facc15; padding: 12px; border-radius: 12px; color: #fef08a; }
    .win { color: #22c55e; font-weight: 900; }
    .loss { color: #ef4444; font-weight: 900; }
    .buyBtn { background: #22c55e; color: #fff; border: 0; padding: 16px; border-radius: 12px; font-weight: 900; font-size: 18px; width: 100%; cursor: pointer; }
    .sellBtn { background: #ef4444; color: #fff; border: 0; padding: 16px; border-radius: 12px; font-weight: 900; font-size: 18px; width: 100%; cursor: pointer; }
    
    /* Quotex Interactive Chart Canvas */
    #chartContainer { position: relative; width: 100%; height: 320px; background: #090d16; border-radius: 12px; overflow: hidden; border: 1px solid #334155; margin-top: 10px; }
    #demoCanvas { width: 100%; height: 100%; }
    .tradeBadge { position: absolute; right: 15px; top: 15px; background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 8px; border: 1px solid #334155; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">TRADING BY RAHAT</div>
    <div class="small">Quotex Pro Demo Edition V31</div>
  </div>
  <div style="text-align:right">
    <div style="margin-top:4px"><b>$ <input id="bal" value="50" style="width:50px;text-align:center"> ব্যালেন্স</b></div>
  </div>
</header>

<div class="tabs">
  <button class="active" onclick="setCat('quotex_otc',this)">কোটেক্স ওটিসি (OTC)</button>
  <button onclick="setCat('binary',this)">বাইনারি রিয়েল</button>
  <button onclick="setCat('crypto',this)">ক্রিপ্টো (২৪/৭)</button>
</div>

<!-- DEMO TRADE TAB -->
<div id="pageDemo">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>🎮 কোটেক্স রিয়েল-টাইম ডেমো</h3>
      <div><b>ডেমো ব্যালেন্স: $<span id="demoBal">10000.00</span></b></div>
    </div>
    
    <label><b>মার্কেট পেয়ার বাছো:</b></label>
    <select id="demoMarket" onchange="changeDemoPair()"></select>

    <!-- LIVE QUOTEX SIMULATED CHART CANVAS -->
    <div id="chartContainer">
      <canvas id="demoCanvas"></canvas>
      <div id="livePnlBadge" class="tradeBadge">মার্কেট কারেন্ট প্রাইস: <span id="currentLivePrice">--</span></div>
    </div>

    <div class="row" style="margin-top:10px">
      <div><div class="small">এন্ট্রি প্রাইস</div><b id="entryPriceDisplay">--</b></div>
      <div><div class="small">কাউন্টডাউন</div><b id="timerDisplay">00:00</b></div>
      <div><div class="small">লাইভ PnL</div><b id="pnlDisplay">--</b></div>
    </div>

    <div style="margin-top:10px">
      <label><b>ট্রেড অ্যামাউন্ট ($):</b></label>
      <input id="demoAmt" value="10">
      <label><b>টাইমফ্রেম:</b></label>
      <select id="demoTime">
        <option value="10">১০ সেকেন্ড (ফাস্ট ট্রেড)</option>
        <option value="30">৩০ সেকেন্ড</option>
        <option value="60">১ মিনিট</option>
      </select>
    </div>

    <div class="row" style="margin-top:10px">
      <div style="background:transparent;padding:0"><button class="buyBtn" onclick="placeQuotexTrade('CALL')">CALL (উপরে) 🟢</button></div>
      <div style="background:transparent;padding:0"><button class="sellBtn" onclick="placeQuotexTrade('PUT')">PUT (নিচে) 🔴</button></div>
    </div>

    <h4>📊 ডেমো ট্রেড অর্ডার বুক</h4>
    <div id="demoHist" class="small"></div>
  </div>
</div>

<div class="bottom">
  <button class="active">🎮 কোটেক্স ডেমো</button>
</div>

<script>
var PAIRS = [
  ["EUR/USD (OTC)", 1.08500],
  ["GBP/USD (OTC)", 1.27500],
  ["AUD/CAD (OTC)", 0.88300],
  ["USD/JPY (OTC)", 149.500],
  ["GOLD (OTC)", 2320.00]
];

var currentPrice = 1.08500;
var candleHistory = [];
var activeTrade = null;
var demoBalance = 10000.00;
var tradeLogs = [];

// Populate Dropdown
function initPairs() {
  var s = document.getElementById('demoMarket');
  s.innerHTML = '';
  for(var i=0; i<PAIRS.length; i++) {
    var o = document.createElement('option');
    o.value = i;
    o.text = PAIRS[i][0];
    s.appendChild(o);
  }
  changeDemoPair();
}

function changeDemoPair() {
  var idx = document.getElementById('demoMarket').value || 0;
  currentPrice = PAIRS[idx][1];
  generateCandles();
}

// Generate Initial Candle Data
function generateCandles() {
  candleHistory = [];
  var base = currentPrice;
  for(var i=0; i<30; i++) {
    var open = base + (Math.random()-0.5)*0.0008;
    var close = open + (Math.random()-0.5)*0.0008;
    var high = Math.max(open, close) + Math.random()*0.0003;
    var low = Math.min(open, close) - Math.random()*0.0003;
    candleHistory.push({open:open, high:high, low:low, close:close});
    base = close;
  }
}

// Live Chart Renderer (Canvas API)
function drawChart() {
  var canvas = document.getElementById('demoCanvas');
  var ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Price Movement Simulation
  currentPrice += (Math.random() - 0.495) * 0.00015;
  var lastCandle = candleHistory[candleHistory.length - 1];
  lastCandle.close = currentPrice;
  if(currentPrice > lastCandle.high) lastCandle.high = currentPrice;
  if(currentPrice < lastCandle.low) lastCandle.low = currentPrice;

  document.getElementById('currentLivePrice').innerText = currentPrice.toFixed(5);

  // Find min/max for scale
  var minP = Infinity, maxP = -Infinity;
  for(var i=0; i<candleHistory.length; i++) {
    if(candleHistory[i].low < minP) minP = candleHistory[i].low;
    if(candleHistory[i].high > maxP) maxP = candleHistory[i].high;
  }
  if(activeTrade) {
    if(activeTrade.entryPrice < minP) minP = activeTrade.entryPrice;
    if(activeTrade.entryPrice > maxP) maxP = activeTrade.entryPrice;
  }
  var padding = (maxP - minP) * 0.1 || 0.001;
  minP -= padding; maxP += padding;

  // Draw Candles
  var candleWidth = canvas.width / 35;
  for(var i=0; i<candleHistory.length; i++) {
    var c = candleHistory[i];
    var x = i * (candleWidth + 2) + 10;
    var yOpen = canvas.height - ((c.open - minP)/(maxP - minP)) * canvas.height;
    var yClose = canvas.height - ((c.close - minP)/(maxP - minP)) * canvas.height;
    var yHigh = canvas.height - ((c.high - minP)/(maxP - minP)) * canvas.height;
    var yLow = canvas.height - ((c.low - minP)/(maxP - minP)) * canvas.height;

    var isGreen = c.close >= c.open;
    ctx.strokeStyle = isGreen ? '#22c55e' : '#ef4444';
    ctx.fillStyle = isGreen ? '#22c55e' : '#ef4444';

    // Wick
    ctx.beginPath();
    ctx.moveTo(x + candleWidth/2, yHigh);
    ctx.lineTo(x + candleWidth/2, yLow);
    ctx.stroke();

    // Body
    ctx.fillRect(x, Math.min(yOpen, yClose), candleWidth, Math.max(Math.abs(yClose - yOpen), 2));
  }

  // Draw Trade Entry Line if active
  if(activeTrade) {
    var yEntry = canvas.height - ((activeTrade.entryPrice - minP)/(maxP - minP)) * canvas.height;
    ctx.strokeStyle = activeTrade.type === 'CALL' ? '#22c55e' : '#ef4444';
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, yEntry);
    ctx.lineTo(canvas.width, yEntry);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1;

    // Label
    ctx.fillStyle = activeTrade.type === 'CALL' ? '#22c55e' : '#ef4444';
    ctx.fillText(activeTrade.type + " @ " + activeTrade.entryPrice.toFixed(5), 10, yEntry - 6);

    // Live PnL Update
    var isWin = activeTrade.type === 'CALL' ? (currentPrice >= activeTrade.entryPrice) : (currentPrice <= activeTrade.entryPrice);
    document.getElementById('pnlDisplay').className = isWin ? 'win' : 'loss';
    document.getElementById('pnlDisplay').innerText = isWin ? '+$' + (activeTrade.amount * 0.88).toFixed(2) : '-$' + activeTrade.amount.toFixed(2);
  }
}

// Start Trade
function placeQuotexTrade(type) {
  if(activeTrade) { alert('একটি ট্রেড রান রয়েছে! শেষ হওয়া পর্যন্ত অপেক্ষা করুন।'); return; }
  var amt = parseFloat(document.getElementById('demoAmt').value || 10);
  var secs = parseInt(document.getElementById('demoTime').value || 10);

  if(amt > demoBalance) { alert('ডেমো ব্যালেন্সের চেয়ে বেশি ইনপুট দেওয়া হয়েছে!'); return; }

  demoBalance -= amt;
  document.getElementById('demoBal').innerText = demoBalance.toFixed(2);

  activeTrade = {
    type: type,
    entryPrice: currentPrice,
    amount: amt,
    timeLeft: secs,
    pair: PAIRS[document.getElementById('demoMarket').value][0]
  };

  document.getElementById('entryPriceDisplay').innerText = activeTrade.entryPrice.toFixed(5);

  var timer = setInterval(function(){
    activeTrade.timeLeft--;
    document.getElementById('timerDisplay').innerText = '00:' + (activeTrade.timeLeft < 10 ? '0' : '') + activeTrade.timeLeft;

    if(activeTrade.timeLeft <= 0) {
      clearInterval(timer);
      finishTrade();
    }
  }, 1000);
}

// Finish Trade Calculation
function finishTrade() {
  var isWin = activeTrade.type === 'CALL' ? (currentPrice >= activeTrade.entryPrice) : (currentPrice <= activeTrade.entryPrice);
  var profit = isWin ? (activeTrade.amount * 1.88) : 0;
  demoBalance += profit;

  document.getElementById('demoBal').innerText = demoBalance.toFixed(2);

  var resultTxt = isWin ? '<span class="win">✅ WIN (+$' + (activeTrade.amount*0.88).toFixed(2) + ')</span>' : '<span class="loss">❌ LOSS (-$' + activeTrade.amount.toFixed(2) + ')</span>';
  
  tradeLogs.unshift('<div>' + activeTrade.pair + ' | ' + activeTrade.type + ' | Entry: ' + activeTrade.entryPrice.toFixed(5) + ' | Close: ' + currentPrice.toFixed(5) + ' | ' + resultTxt + '</div>');

  document.getElementById('demoHist').innerHTML = tradeLogs.slice(0, 10).join('');
  
  activeTrade = null;
  document.getElementById('entryPriceDisplay').innerText = '--';
  document.getElementById('timerDisplay').innerText = '00:00';
  document.getElementById('pnlDisplay').innerText = '--';
}

// Game Loop Animation
setInterval(drawChart, 400);
initPairs();
</script>
</body>
  </html>
